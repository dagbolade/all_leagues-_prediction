<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA Meta Tags -->
    <meta name="description"
        content="AI-powered football predictions with advanced analytics, live scores, and comprehensive match analysis">
    <meta name="theme-color" content="#2E8B57">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FootyPredict">

    <!-- PWA Manifest -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-152x152.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/icon-192x192.png') }}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/icon-72x72.png') }}">

    <title>ProPredict Analytics - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="navbar-brand"><i class="bi bi-activity"></i> ProPredict Analytics</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/predict') %}active{% endif %}"
                            href="/predict">Make Prediction</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/statistics') %}active{% endif %}"
                            href="/statistics"><i class="bi bi-graph-up"></i> Statistics</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="advancedDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-grid-3x3-gap"></i> Advanced
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="advancedDropdown">
                            <li><a class="dropdown-item" href="/multi"><i class="bi bi-controller"></i> Multi-Sport
                                    Platform</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="/accuracy"><i
                                        class="bi bi-patch-check-fill text-success"></i> Accuracy Tracker</a></li>
                            <li><a class="dropdown-item" href="/advanced/accumulator"><i class="bi bi-layers-fill"></i>
                                    Accumulator Builder</a></li>
                            <li><a class="dropdown-item" href="/live-tracker"><i class="bi bi-broadcast"></i> Live
                                    Tracker</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/my-predictions') %}active{% endif %}"
                            href="/my-predictions"><i class="bi bi-list-check"></i> My Picks</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/live-predictions') %}active{% endif %}"
                            href="/live-predictions">Live Predictions</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path.startswith('/results') %}active{% endif %}"
                            href="/results">Results</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 fade-in">
        <div class="row">
            <!-- Main content -->
            <div class="col-lg-8">
                {% block content %}{% endblock %}
            </div>

            <!-- Live Scores Sidebar -->
            <div class="col-lg-4">
                <div class="card live-scores-card card-accent">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Live Matches</h5>
                        <span class="refresh-time" id="lastUpdated"></span>
                    </div>
                    <div class="card-body">
                        <div id="liveScores" class="live-scores-container">
                            <div class="loading-spinner">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- PWA Scripts -->
    <script src="{{ url_for('static', filename='js/pwa-manager.js') }}"></script>

    <!-- Theme Manager -->
    <script src="{{ url_for('static', filename='js/theme-manager.js') }}"></script>

    <script src="{{ url_for('static', filename='js/live-scores.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/save-predictions.js') }}?v=2"></script>
    <script src="{{ url_for('static', filename='js/scroll-to-predictions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/prediction-loading.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/static/js/three-scene.js"></script>
    <script>
        // Initialize LiveScoresManager
        document.addEventListener('DOMContentLoaded', function () {
            const liveScores = new LiveScoresManager();

            // Update the last updated time
            function updateLastUpdated() {
                const now = new Date();
                document.getElementById('lastUpdated').textContent =
                    `Last updated: ${now.toLocaleTimeString()}`;
            }

            // Initial update
            updateLastUpdated();

            // Update time every minute
            setInterval(updateLastUpdated, 60000);
        });
    </script>
</body>

</html>
