<!-- 400 Error Page -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 - Bad Request | Football Predictor Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }

        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #ffc107;
            margin: 0;
            line-height: 1;
        }

        .error-message {
            font-size: 1.5rem;
            color: #333;
            margin: 1rem 0;
        }

        .error-description {
            color: #666;
            margin-bottom: 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .btn-home {
            background: linear-gradient(45deg, #2E8B57, #32CD32);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            color: white;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-code">400</h1>
        <h2 class="error-message">Bad Request</h2>
        <p class="error-description">
            Yellow card! The request you sent doesn't follow the rules.
            <br>
            Please check your input and try again.
        </p>
        {% if error %}
        <div class="alert alert-warning">
            {{ error }}
        </div>
        {% endif %}
        <a href="/" class="btn-home">Return to Home</a>
        <div class="mt-3">
            <a href="/predict" class="text-decoration-none text-muted">Make a Prediction</a>
        </div>
    </div>
</body>

</html>
